<style>
html, body { margin: 0; } img { max-width: 100%; } [hidden] { display: none !important; }

/* Layout: fixed video hero, a wine panel rises over it carrying question cards that zigzag and scale in, a linen outro with a "send" pill. Single deliberate look (wine + sand). */
:root {
  --wine: #531B24;
  --merlot: #6A2931;
  --taupe: #C6B7A2;
  --sand: #E7D8C3;
  --linen: #F3ECE2;
  --ink: #2A0E13;
  --font: "Inter Tight", "Helvetica Neue", Arial, sans-serif;
  --serif: "Instrument Serif", "Times New Roman", Georgia, serif;
  --ease: cubic-bezier(.25,.1,.25,1);
  --gut: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (min-width: 1024px) { :root { --gut: max(32px, env(safe-area-inset-left, 0px)); --gut-r: max(32px, env(safe-area-inset-right, 0px)); } }

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--wine);
  color: var(--linen);
  font-family: var(--font);
  font-weight: 500;
  letter-spacing: -0.02em;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
@media (hover: hover) and (pointer: fine) and (min-width: 1024px) {
  body.has-cursor, body.has-cursor a, body.has-cursor button, body.has-cursor label { cursor: none; }
  body.has-cursor input, body.has-cursor textarea { cursor: text; }
}
:focus-visible { outline: 2px solid var(--taupe); outline-offset: 3px; }

/* ---------- Custom cursor ---------- */
#cursor {
  position: fixed; left: 0; top: 0; z-index: 60; pointer-events: none;
  width: 48px; height: 48px; transform: translate(-50%, -50%);
  transition: width .25s var(--ease), height .25s var(--ease), opacity .2s;
  display: none; opacity: 0;
}
#cursor svg { width: 100%; height: 100%; display: block; }
#cursor.small { width: 14px; height: 14px; }
#cursor.small .glyph { opacity: 0; }
@media (hover: hover) and (pointer: fine) and (min-width: 1024px) { #cursor { display: block; } }

/* ---------- Video ---------- */
#main-canvas {
  position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  background: var(--merlot);
}
#main-canvas video {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; object-position: 70% center;
}
#main-canvas::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, rgba(83,27,36,.72) 0%, rgba(83,27,36,.25) 45%, rgba(83,27,36,0) 70%),
              linear-gradient(0deg, rgba(83,27,36,.55) 0%, rgba(83,27,36,0) 35%);
}
@media (max-width: 639px) {
  #main-canvas video { object-position: 78% center; }
  #main-canvas::after { background: linear-gradient(180deg, rgba(83,27,36,.85) 0%, rgba(83,27,36,.35) 40%, rgba(83,27,36,.2) 60%, rgba(83,27,36,.8) 100%); }
}

/* ---------- Fixed hero UI ---------- */
.fx { position: fixed; z-index: 20; pointer-events: none; }
.rise { opacity: 0; transform: translateY(12px); animation: rise .6s var(--ease) forwards; }
@keyframes rise { to { opacity: 1; transform: none; } }

#logo {
  top: calc(16px + env(safe-area-inset-top, 0px)); left: var(--gut);
  line-height: .86; letter-spacing: -0.06em;
}
#logo .ha { font-size: 84px; font-weight: 600; display: block; }
#logo .ws { font-size: 15px; letter-spacing: .18em; font-weight: 500; display: block; margin-top: 10px; color: var(--sand); }
@media (min-width: 640px) { #logo .ha { font-size: 150px; } }
@media (min-width: 1024px) { #logo { top: calc(32px + env(safe-area-inset-top, 0px)); } #logo .ha { font-size: 190px; } #logo .ws { font-size: 17px; } }

#caption {
  left: var(--gut); top: calc(148px + env(safe-area-inset-top, 0px));
  width: calc(100vw - 32px); max-width: 520px;
  font-size: 13px; line-height: 1.45; letter-spacing: -0.02em; color: var(--sand);
  animation-delay: .3s;
}
#caption b { color: var(--linen); font-weight: 600; }
@media (min-width: 640px) { #caption { top: calc(230px + env(safe-area-inset-top, 0px)); width: calc(50vw - 48px); font-size: 14px; } }
@media (min-width: 1024px) { #caption { top: calc(300px + env(safe-area-inset-top, 0px)); } }

#nav {
  top: calc(16px + env(safe-area-inset-top, 0px)); right: var(--gut-r);
  display: flex; align-items: center; gap: 20px; height: 30px;
  pointer-events: auto; animation-delay: .15s;
}
@media (min-width: 1024px) { #nav { top: calc(32px + env(safe-area-inset-top, 0px)); gap: 44px; } }
.navbtn {
  background: none; border: 0; padding: 4px 0; color: var(--linen);
  font: 500 13px/1 var(--font); letter-spacing: .02em; text-transform: uppercase;
}
@media (min-width: 1024px) { .navbtn { font-size: 15px; } }
#about-btn { display: none; }
@media (min-width: 640px) { #about-btn { display: inline-block; } }
#menu-btn { width: 28px; height: 28px; padding: 0; }
#menu-btn svg { width: 100%; height: 100%; display: block; }

#outro-info {
  right: var(--gut-r); bottom: calc(48px + env(safe-area-inset-bottom, 0px));
  width: 330px; max-width: calc(100vw - 32px);
  display: flex; flex-direction: column; align-items: flex-start; gap: 14px;
  animation-delay: .45s;
}
@media (max-width: 639px) { #outro-info { left: var(--gut); right: var(--gut-r); width: auto; max-width: none; } }
.circle { position: relative; width: 30px; height: 30px; }
.circle svg { position: absolute; inset: 0; width: 100%; height: 100%; }
#circle-symbol {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 13px; letter-spacing: -0.04em; text-transform: uppercase;
}
.coll { font-size: 26px; line-height: 1; letter-spacing: -0.04em; text-transform: uppercase; }
.coll span { color: var(--taupe); }
.price { font-size: 72px; line-height: .9; letter-spacing: -0.05em; }
.price small { font-size: 22px; letter-spacing: -0.02em; color: var(--sand); margin-left: 6px; }
@media (min-width: 1024px) { .coll { font-size: 30px; } .price { font-size: 88px; } }
.scrollhint { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--sand); display: flex; align-items: center; gap: 10px; }
.scrollhint i { display: inline-block; width: 34px; height: 1px; background: var(--sand); transform-origin: left; animation: hint 1.8s var(--ease) infinite; }
@keyframes hint { 0% { transform: scaleX(0); } 60% { transform: scaleX(1); } 100% { transform: scaleX(1); opacity: 0; } }

/* Compact bar shown once the panel covers the hero */
#bar {
  position: fixed; z-index: 30; top: 0; left: 0; right: 0;
  padding: calc(12px + env(safe-area-inset-top, 0px)) var(--gut-r) 12px var(--gut);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: rgba(83,27,36,.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(198,183,162,.18);
  transform: translateY(-100%); transition: transform .45s var(--ease), background .4s, color .4s;
}
#bar.on { transform: none; }
#bar .mark { font-size: 20px; font-weight: 600; letter-spacing: -0.05em; color: var(--linen); text-decoration: none; }
#bar .mark span { font-size: 11px; letter-spacing: .16em; font-weight: 500; color: var(--taupe); margin-left: 8px; }
#bar .right { display: flex; align-items: center; gap: 16px; }
.prog { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--sand); font-variant-numeric: tabular-nums; }
.prog .track { width: 90px; height: 3px; background: rgba(198,183,162,.25); border-radius: 3px; overflow: hidden; }
.prog .fill { height: 100%; width: 0; background: var(--sand); transition: width .4s var(--ease); }
@media (max-width: 420px) { .prog .track { width: 50px; } #bar .mark span { display: none; } }

/* ---------- Scroll content ---------- */
#scroll-spacer { position: relative; user-select: none; }
#scroll-spacer input, #scroll-spacer textarea { user-select: text; }
.hero-space { height: 100vh; height: 100svh; }

#panel {
  position: relative; z-index: 10; background: var(--wine);
  border-radius: 28px 28px 0 0;
  box-shadow: 0 -30px 80px rgba(42,14,19,.45);
  padding-top: min(260px, 26vh); padding-bottom: 30vh;
}
.wrap { padding-left: var(--gut); padding-right: var(--gut-r); }

.intro { max-width: 1180px; margin: 0 auto 18vh; }
.eyebrow { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--taupe); }
.intro h1 {
  font-size: clamp(44px, 8.4vw, 132px); line-height: .92; letter-spacing: -0.055em; font-weight: 500;
  margin: 18px 0 28px; text-wrap: balance;
}
.intro h1 em { font-family: var(--serif); font-style: italic; font-weight: 400; letter-spacing: -0.03em; color: var(--sand); }
.intro p.lead { max-width: 58ch; font-size: 17px; line-height: 1.55; color: var(--sand); font-weight: 400; letter-spacing: -0.01em; }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; margin-top: 48px; }
@media (max-width: 760px) { .steps { grid-template-columns: 1fr; } }
.step { border-top: 1px solid rgba(198,183,162,.35); padding-top: 16px; display: grid; gap: 8px; }
.step b { font-size: 13px; letter-spacing: .12em; color: var(--taupe); font-weight: 500; }
.step span { font-size: 19px; line-height: 1.3; letter-spacing: -0.03em; }
.step small { font-size: 14px; line-height: 1.5; color: var(--sand); font-weight: 400; }

/* Cards */
#cards { display: flex; flex-direction: column; gap: 14vh; max-width: 1400px; margin: 0 auto; }
.bp-card {
  will-change: transform, opacity;
  width: min(640px, 100%);
  background: var(--linen); color: var(--ink);
  border-radius: 26px;
  padding: 30px 26px 30px;
  box-shadow: 0 40px 80px -30px rgba(20,5,8,.6);
  transform-origin: left bottom;
}
@media (min-width: 900px) {
  .bp-card { padding: 42px 44px 44px; width: min(660px, 56vw); }
  .bp-card.pos-0 { margin-left: 0; transform-origin: right bottom; }
  .bp-card.pos-1 { margin-left: auto; transform-origin: left bottom; }
  .bp-card.pos-2 { margin-left: 18%; transform-origin: right bottom; }
}
.bp-card.feature { background: var(--sand); }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 6px; }
.card-head .num { font-size: 13px; letter-spacing: .14em; color: var(--merlot); font-variant-numeric: tabular-nums; }
.card-head .count { font-size: 12px; color: #8a6a63; font-variant-numeric: tabular-nums; }
.bp-card h2 { font-family: var(--serif); font-size: clamp(40px, 5vw, 62px); line-height: .95; letter-spacing: -0.02em; font-weight: 400; margin: 6px 0 10px; color: var(--wine); text-wrap: balance; }
.bp-card .note { font-size: 15px; line-height: 1.5; color: #7a5952; font-weight: 400; margin: 0 0 8px; max-width: 52ch; }
.q { display: grid; gap: 12px; padding: 22px 0; border-top: 1px solid rgba(106,41,49,.14); }
.q:first-of-type { border-top: 0; }
.q > label, .q > .ql { font-family: var(--serif); font-size: 23px; line-height: 1.18; letter-spacing: -0.005em; color: var(--ink); font-weight: 400; text-wrap: pretty; }
@media (max-width: 639px) { .q > label, .q > .ql { font-size: 21px; } }
.q .hint { font-size: 13.5px; line-height: 1.45; color: #8a6a63; font-weight: 400; font-style: italic; margin-top: -4px; }
.req { color: var(--merlot); }
.field {
  width: 100%; border: 0; border-bottom: 1.5px solid rgba(106,41,49,.35);
  background: transparent; color: var(--ink); padding: 8px 0 10px;
  font: 400 17px/1.45 var(--font); letter-spacing: -0.01em; border-radius: 0;
  transition: border-color .2s;
}
.field::placeholder { color: #a89089; }
.field:focus { outline: none; border-bottom-color: var(--merlot); }
textarea.field { resize: vertical; min-height: 84px; }
textarea.field.big {
  min-height: 320px; border: 1.5px solid rgba(106,41,49,.3); border-radius: 18px; padding: 16px 18px;
  background: rgba(243,236,226,.55);
}
textarea.field.big:focus { border-color: var(--merlot); }
.field.invalid { border-bottom-color: #b3261e; }

.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { position: relative; }
.pill input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.pill span {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 16px; border-radius: 999px;
  border: 1.5px solid rgba(106,41,49,.3);
  font-size: 14px; line-height: 1.2; color: var(--wine); letter-spacing: -0.01em;
  transition: background .2s, color .2s, border-color .2s, transform .15s;
  user-select: none;
}
.pill span::before {
  content: ""; width: 7px; height: 7px; border-radius: 50%;
  border: 1.5px solid currentColor; transition: background .2s;
}
.pill:hover span { border-color: var(--merlot); }
.pill input:checked + span { background: var(--merlot); color: var(--linen); border-color: var(--merlot); }
.pill input:checked + span::before { background: var(--sand); border-color: var(--sand); }
.pill input:focus-visible + span { outline: 2px solid var(--merlot); outline-offset: 2px; }
.other { margin-top: 2px; }


/* ---------- Artistic gallery (scattered grid, scales in and out) ---------- */
.gal-head { max-width: 1400px; margin: 0 auto 8vh; display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; }
.gal-head h2 { font-size: clamp(34px, 5vw, 72px); line-height: .95; letter-spacing: -0.05em; font-weight: 500; margin: 10px 0 0; max-width: 14ch; text-wrap: balance; }
.gal-head h2 em { font-family: var(--serif); font-style: italic; font-weight: 400; letter-spacing: -0.02em; color: var(--sand); }
.gal-head p { max-width: 38ch; font-size: 15px; line-height: 1.55; color: var(--sand); font-weight: 400; margin: 0; }
#gallery { max-width: 1400px; margin: 0 auto 22vh; display: grid; gap: 0; }
.g-row { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: 14px; margin-bottom: 14px; }
.g-cell { aspect-ratio: 2 / 3; max-width: 100%; min-width: 0; }
.g-tile {
  position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 4px;
  transform: scale(0); will-change: transform; background: var(--merlot);
}
.g-tile img { width: 100%; height: 100%; object-fit: cover; display: block; transform: scale(1.18); will-change: transform; }
.g-tile figcaption {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 14px 12px;
  display: flex; justify-content: space-between; align-items: flex-end; gap: 8px;
  font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--linen);
  background: linear-gradient(0deg, rgba(42,14,19,.7), rgba(42,14,19,0));
}
.g-tile figcaption b { font-weight: 500; font-variant-numeric: tabular-nums; color: var(--taupe); }
.mock { position: absolute; inset: 0; padding: 9% 9% 18%; display: flex; flex-direction: column; gap: 6%; }
.mock.l { background: var(--linen); } .mock.s { background: var(--sand); } .mock.t { background: var(--taupe); } .mock.w { background: var(--merlot); }
.mock .chrome { display: flex; gap: 5px; align-items: center; }
.mock .chrome i { width: 7px; height: 7px; border-radius: 50%; background: var(--merlot); opacity: .35; }
.mock .chrome u { flex: 1; height: 7px; border-radius: 7px; background: var(--wine); opacity: .12; margin-left: 6px; }
.mock .bar { height: 8px; border-radius: 8px; background: var(--wine); }
.mock .bar.f { opacity: .25; }
.mock .hl { font-size: clamp(18px, 2.3vw, 34px); line-height: .92; letter-spacing: -0.05em; color: var(--wine); font-weight: 500; }
.mock.w .hl { color: var(--linen); }
.mock .img { flex: 1; border-radius: 6px; background:
  radial-gradient(circle at 70% 30%, var(--taupe) 0 18%, transparent 19%),
  linear-gradient(160deg, var(--merlot), var(--wine)); }
.mock .pill2 { align-self: flex-start; padding: 6px 12px; border-radius: 999px; background: var(--wine); color: var(--linen); font-size: 10px; letter-spacing: .06em; }
.mock.w .pill2 { background: var(--sand); color: var(--wine); }
.mock .grid2 { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mock .grid2 span { border-radius: 6px; background: var(--taupe); position: relative; }
.mock .grid2 span:nth-child(2n) { background: var(--merlot); }
.mock .grid2 span::after { content: ""; position: absolute; left: 8%; bottom: 8%; width: 40%; height: 7px; border-radius: 7px; background: var(--linen); opacity: .8; }
.mock .cal { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; align-content: start; }
.mock .cal span { aspect-ratio: 1; border-radius: 50%; background: var(--wine); opacity: .1; }
.mock .cal span.on { opacity: 1; background: var(--merlot); }
.mock .cal span.mid { opacity: .45; background: var(--taupe); }
.mock .masonry { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; gap: 6px; }
.mock .masonry span { background: var(--sand); border-radius: 4px; opacity: .85; }
.mock .masonry span:nth-child(1) { grid-row: span 2; background: var(--taupe); }
.mock .masonry span:nth-child(4) { grid-column: span 2; background: var(--linen); opacity: .5; }
.mock .phone { flex: 1; align-self: center; width: 62%; border-radius: 18px; border: 3px solid var(--wine); padding: 12% 10%; display: flex; flex-direction: column; gap: 8px; background: var(--linen); }
.mock .phone .bar { height: 6px; }
.mock .qr { width: 38%; aspect-ratio: 1; align-self: center; margin-top: auto;
  background:
    linear-gradient(90deg, var(--wine) 50%, transparent 0) 0 0 / 25% 25%,
    linear-gradient(var(--wine) 50%, transparent 0) 0 0 / 25% 25%;
  opacity: .85; border: 3px solid var(--wine); }
@media (prefers-reduced-motion: reduce) { .g-tile { transform: none; will-change: auto; } }


/* ---------- Kinetic type: words rise from a mask ---------- */
.rv .w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .08em; margin-bottom: -.08em; }
.rv .w > span { display: inline-block; will-change: transform; }

/* ---------- Giant scrolling band ---------- */
.band { position: relative; margin: 0 calc(-1 * var(--gut-r)) 18vh calc(-1 * var(--gut)); overflow: hidden; display: grid; gap: 1vh; }
.band .row { white-space: nowrap; font-size: clamp(56px, 11vw, 190px); line-height: .95; letter-spacing: -0.05em; font-weight: 500; will-change: transform; }
.band .row i { font-family: var(--serif); font-weight: 400; letter-spacing: -0.02em; color: var(--sand); }
.band .row b { font-weight: 500; color: transparent; -webkit-text-stroke: 1.5px var(--taupe); }
.band .row .dot { display: inline-block; width: .32em; height: .32em; border-radius: 50%; background: var(--merlot); margin: 0 .35em; vertical-align: .18em; }


/* ---------- Full-screen "every detail" moment (glass over video) ---------- */
.words-hero {
  position: relative; margin: 0 calc(-1 * var(--gut-r)) 0 calc(-1 * var(--gut));
  min-height: 100vh; min-height: 100svh; overflow: hidden; border-radius: 28px;
  display: flex; color: var(--linen); background: var(--merlot);
}
.wh-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 80% center; }
@media (min-width: 768px) { .wh-video { object-position: right center; } }
@media (min-width: 1024px) { .wh-video { object-position: center center; } }
.wh-inner { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; padding: 16px var(--gut-r) 16px var(--gut); }
@media (min-width: 640px) { .wh-inner { padding: 32px 40px 48px; } }
@media (min-width: 1024px) { .wh-inner { padding: 32px 48px 64px; } }
.glass { background: rgba(42,14,19,.34); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(243,236,226,.14); }
.wh-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.wh-tag { display: inline-flex; align-items: center; gap: 14px; padding: 10px 18px; border-radius: 16px; font-size: 13px; letter-spacing: .04em; }
.wh-tag .num { color: var(--taupe); letter-spacing: .14em; font-variant-numeric: tabular-nums; }

  };
  const secL = s => lang === 'fr' ? { ...s, ...(FR[s.id] || {}) } : s;
  const qL = (s, q) => lang === 'fr' ? { ...q, ...(FR[s.id + '.' + q.id] || {}) } : q;

  /* ---------------- Render the form (in the current language) ---------------- */
  const form = document.getElementById('cards');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const small = matchMedia('(max-width: 1023px)').matches || !!(navigator.connection && navigator.connection.saveData);
  const SRC = {
    R: small ? 'hero-m.mp4' : 'hero.mp4', L: small ? 'hero-l-m.mp4' : 'hero-l.mp4',
    pR: small ? 'poster-m.jpg' : 'poster.jpg', pL: small ? 'poster-l-m.jpg' : 'poster-l.jpg',
  };
  let cards = [];
  function renderForm() {
    let html = '';

        html += `<section class="words-hero" id="sec-${s.id}" aria-labelledby="h-${s.id}">

          <div class="wh-inner">
            <div class="wh-top"><span class="glass wh-tag"><span class="num">${num}</span><span>${t('whTag')}</span></span><span class="count" data-count="${s.id}"></span></div>
            <div class="wh-main">
              <div class="wh-left">
                <h2 id="h-${s.id}">${t('whH2')}</h2>
                <p class="wh-sub">${esc(s.note)}</p>
                <div class="wh-box glass">
                  <label for="${fid}" class="wh-label">${esc(q.l)}</label>
                  <textarea class="wh-field" id="${fid}" name="${fid}" rows="9" placeholder="${esc(q.ph)}"></textarea>
                  <div class="wh-actions">
                    <button type="button" class="wh-quick" data-quick>${t('whQuick')}</button>
                    <button type="button" class="wh-next" data-next>${t('whNext')}</button>
                  </div>
                </div>
              </div>
              <div class="wh-pills">${q.h.split(' · ').map(x => `<span class="glass wh-pill">${esc(x.charAt(0).toUpperCase() + x.slice(1))}</span>`).join('')}</div>
            </div>
          </div>
        </section>`;
        return;
      }
      html += `<section class="bp-card pos-${si % 3}" id="sec-${s.id}" aria-labelledby="h-${s.id}">
        <div class="card-head"><span class="num">${num}</span><span class="count" data-count="${s.id}"></span></div>
        <h2 id="h-${s.id}">${esc(s.title)}</h2>${s.note ? `<p class="note">${esc(s.note)}</p>` : ''}`;
      s0.qs.forEach(q0 => {
        const q = qL(s0, q0), fid = 'q-' + s.id + '-' + q.id;
        const lab = esc(q.l) + (q.req ? ' <span class="req">*</span>' : '');
        const hint = q.h ? `<span class="hint">${esc(q.h)}</span>` : '';
        if (q.t === 'text') {
          html += `<div class="q"><label for="${fid}">${lab}</label>${hint}<input class="field" id="${fid}" name="${fid}" type="${q.type || 'text'}" ${q.type === 'tel' ? 'inputmode="tel"' : ''} ${q.req ? 'required' : ''} placeholder="${esc(q.ph || t('yourAnswer'))}" autocomplete="off"></div>`;
        } else if (q.t === 'area') {
          html += `<div class="q"><label for="${fid}">${lab}</label>${hint}<textarea class="field" id="${fid}" name="${fid}" rows="3" placeholder="${esc(q.ph || t('yourAnswer'))}"></textarea></div>`;
        } else {
          const type = q.t === 'radio' ? 'radio' : 'checkbox';
          html += `<div class="q" role="group" aria-labelledby="${fid}-l"><span class="ql" id="${fid}-l">${lab}</span>${hint}<div class="pills">`;
          q.o.forEach((o, oi) => { html += `<label class="pill"><input type="${type}" id="${fid}-${oi}" name="${fid}" value="${esc(o)}"><span>${esc(o)}</span></label>`; });
          html += `</div>`;
          if (q.other) html += `<input class="field other" id="${fid}-other" name="${fid}-other" type="text" placeholder="${t('other')}" autocomplete="off">`;
          html += `</div>`;
        }
      });
      if (s.id === 'details') {
        html += `<div class="consent"><label class="consent-row"><input type="checkbox" id="consent"><span>${t('consent')}</span></label><button type="button" class="linkish" data-privacy>${t('readPrivacy')}</button></div>`;

    form.innerHTML = html;
    cards = [...form.querySelectorAll('.bp-card')];

  /* the looping video behind card 02 only loads and plays when it is on screen */
  let whObs = null;
  function watchWordsVideo() {
    const v = form.querySelector('.wh-video'); if (!v) return;
    if (whObs) whObs.disconnect();
    if (!('IntersectionObserver' in window)) { v.src = v.dataset.src; return; }
    whObs = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting) { if (!v.src) v.src = v.dataset.src; if (!reduce) v.play().catch(() => {}); }
      else v.pause();
    }), { rootMargin: '200px' });
    whObs.observe(v);
  }

  /* ---------------- Values / progress / draft ---------------- */
  const KEY = 'ha-web-studio-questionnaire-v1';
  function valueOf(s, q) {
    const fid = 'q-' + s.id + '-' + q.id;
    const el = document.getElementById(fid);
    if (q.t === 'text' || q.t === 'area' || q.t === 'big') return el ? (el.value || '').trim() : '';
    const vals = [...form.querySelectorAll(`input[name="${fid}"]:checked`)].map(i => i.value);
    if (q.other) { const o = document.getElementById(fid + '-other'); if (o && o.value.trim()) vals.push(t('otherPrefix') + o.value.trim()); }
    return vals.join(', ');
  }
  const total = S.reduce((n, s) => n + s.qs.length, 0);
  const fill = document.getElementById('fill'), progtext = document.getElementById('progtext');
  function updateProgress() {
    let done = 0;
    S.forEach(s => {
      let d = 0; s.qs.forEach(q => { if (valueOf(s, q)) d++; });
      done += d;
      const c = form.querySelector(`[data-count="${s.id}"]`);
      if (c) c.textContent = d ? t('answered')(d, s.qs.length) : t('nq')(s.qs.length);
    });
    fill.style.width = (done / total * 100) + '%';
    progtext.textContent = `${done} / ${total}`;
    return done;
  }
  function collect() {
    const data = {};
    form.querySelectorAll('input, textarea').forEach(el => {
      if (el.type === 'checkbox' || el.type === 'radio') { if (el.checked) data[el.id] = 1; }
      else if (el.value) data[el.id] = el.value;
    });
    return data;
  }
  function restore(data) {
    Object.entries(data || {}).forEach(([id, v]) => {
      const el = document.getElementById(id); if (!el) return;
      if (el.type === 'checkbox' || el.type === 'radio') el.checked = true; else el.value = v;
    });
  }
  function saveDraft() { try { localStorage.setItem(KEY, JSON.stringify(collect())); } catch (e) {} }
  function loadDraft() { let d = null; try { d = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {} restore(d); }
  function clearDraft() { try { localStorage.removeItem(KEY); } catch (e) {} }

  let saveT;
  form.addEventListener('input', e => { e.target.classList && e.target.classList.remove('invalid'); updateProgress(); clearTimeout(saveT); saveT = setTimeout(saveDraft, 300); });
  form.addEventListener('change', () => { updateProgress(); saveDraft(); });
  form.addEventListener('submit', e => e.preventDefault());
  form.addEventListener('click', e => {
    if (e.target.closest('[data-next]')) {
      const next = document.getElementById('sec-' + S[2].id);

    } else if (e.target.closest('[data-quick]')) startSend();
  });
  document.addEventListener('click', e => { if (e.target.closest('[data-privacy]')) openSheet('privacy'); });

  /* ---------------- Summary ---------------- */
  function buildSummary() {
    let out = t('sumTitle') + '\n' + t('lang') + '\n';
    S.forEach(s0 => {
      const s = secL(s0), lines = [];
      s0.qs.forEach(q0 => { const q = qL(s0, q0), v = valueOf(s0, q0); if (v) lines.push(q0.t === 'big' ? v : `• ${q.l.replace(/…$/, '')}: ${v}`); });
      if (lines.length) out += `\n*${s.title}*\n` + lines.join('\n') + '\n';
    });
    return out.trim();
  }

  /* ---------------- Static text ---------------- */
  const bandHTML = items => {
    const one = items.map(x => x.startsWith('i:') ? `<i>${x.slice(2)}</i>` : x.startsWith('b:') ? `<b>${x.slice(2)}</b>` : x).join('<span class="dot"></span>') + '<span class="dot"></span>';

  /* ---------------- Sheets ---------------- */
  const sheets = { menu: 'menu-sheet', contact: 'contact-sheet', send: 'send-sheet', privacy: 'privacy-sheet' };
  Object.keys(sheets).forEach(k => sheets[k] = document.getElementById(sheets[k]));
  let lastFocus = null;

  function toast(scope, msg) {

  /* ---------------- Send ---------------- */
  const miss = document.getElementById('miss');

        sendIntro = document.getElementById('send-intro'), waSend = document.getElementById('wa-send');
  const fv = id => { const el = document.getElementById('q-details-' + id); return el ? el.value.trim() : ''; };
  function goDetails(msg) {
    miss.textContent = msg;

  }
  function validate() {
    const s0 = S[0], missing = [];
    ['name', 'business', 'phone'].forEach(id => {
      const el = document.getElementById('q-details-' + id), bad = !el.value.trim();
      el.classList.toggle('invalid', bad);
      if (bad) { const l = qL(s0, s0.qs.find(q => q.id === id)).l; missing.push(l.charAt(0).toLowerCase() + l.slice(1)); }
    });
    if (missing.length) return t('missing')(missing.join(', '));
    const phone = document.getElementById('q-details-phone'), digits = phone.value.replace(/\D/g, '');
    if (!/^[+\d\s().-]+$/.test(phone.value.trim()) || digits.length < 8 || digits.length > 15) { phone.classList.add('invalid'); return t('badPhone'); }
    const email = document.getElementById('q-details-email');
    if (email.value.trim() && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email.value.trim())) { email.classList.add('invalid'); return t('badEmail'); }
    const consent = document.getElementById('consent'), box = consent.closest('.consent');

  }
  sendBtn.addEventListener('click', startSend);
  netSend.addEventListener('click', () => doSend());
  async function doSend() {
    const answers = document.getElementById('summary').textContent.replace(/\*/g, '');
    netSend.disabled = true; netSend.textContent = t('sending');
    let ok = false;
    try {
      if (FORMSPREE) {
        const r = await fetch('https://formspree.io/f/' + FORMSPREE, {
          method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({ name: fv('name'), email: fv('email'), business: fv('business'), phone: fv('phone'),
            language: lang === 'fr' ? 'Français' : 'English',
            _subject: 'New website questionnaire · ' + fv('business'), answers, _gotcha: '' }),
        });
        ok = r.ok;
      }
    } catch (e) {}
    if (ok) {
      clearTimeout(saveT); clearDraft();
      sendTitle.textContent = t('thanks'); sendIntro.textContent = t('thanksP');
      netSend.hidden = true;
      waSend.textContent = t('waAfter');
      waSend.href = `https://wa.me/${WA}?text=${encodeURIComponent(t('waAfterText') + fv('business') + '.')}`;
    } else {
      netSend.disabled = false; netSend.textContent = t('tryAgain');
      sendTitle.textContent = t('failTitle');
      sendIntro.textContent = t('fail') + EMAIL + '.';
      waSend.classList.remove('ghost');
    }
  }
  document.getElementById('copy-all').addEventListener('click', e => {
    copyText(document.getElementById('summary').textContent, e.target.closest('.inner'), t('copiedAll'), document.getElementById('summary'));
  });

  /* ---------------- Language switch ---------------- */
  function setLang(l, first) {
    const data = first ? null : collect();
    lang = l;
    try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
    applyStatic();
    renderForm();
    if (first) loadDraft(); else restore(data);
    updateProgress();
    if (!first) { gCols = 0; renderGallery(); buildReveals(); lastY = -1; }
  }
  document.getElementById('lang-btn').addEventListener('click', () => setLang(lang === 'fr' ? 'en' : 'fr'));
  document.getElementById('lang-btn-2').addEventListener('click', () => setLang(lang === 'fr' ? 'en' : 'fr'));
  setLang(lang, true);

  /* ---------------- Gallery: scattered grid ---------------- */
  const TILES = [
    { img: 'g/s1.jpg', cap: 'arrival' },
    { m: 'show', cap: 'show' },
    { img: 'g/s3.jpg', cap: 'turn' },
    { m: 'store', cap: 'store' },
    { m: 'book', cap: 'book' },
    { img: 'g/s5.jpg', cap: 'detail' },
    { m: 'folio', cap: 'folio' },
    { img: 'g/s2.jpg', cap: 'stride' },
    { m: 'menu', cap: 'menu' },
    { m: 'beauty', cap: 'beauty' },
    { img: 'g/s4.jpg', cap: 'way' },
  ];
  const MOCK = {
    show: `<div class="mock l"><div class="chrome"><i></i><i></i><i></i><u></u></div><div class="hl">Your brand,<br>online.</div><div class="bar f" style="width:70%"></div><div class="img"></div><span class="pill2">CONTACT ON WHATSAPP</span></div>`,
    store: `<div class="mock s"><div class="chrome"><i></i><i></i><i></i><u></u></div><div class="hl">Shop</div><div class="grid2"><span></span><span></span><span></span><span></span></div><span class="pill2">CART · 2</span></div>`,
    book: `<div class="mock w"><div class="hl">Book a<br>session</div><div class="cal">${Array.from({length: 28}, (_, i) => `<span class="${[9,10,17].includes(i) ? 'on' : [3,12,22,24].includes(i) ? 'mid' : ''}"></span>`).join('')}</div><span class="pill2">CONFIRM · 10:30</span></div>`,
    folio: `<div class="mock t"><div class="chrome"><i></i><i></i><i></i><u></u></div><div class="hl">Selected<br>work</div><div class="masonry"><span></span><span></span><span></span><span></span></div></div>`,
    beauty: `<div class="mock w"><div class="chrome"><i style="background:var(--sand)"></i><i style="background:var(--sand)"></i><i style="background:var(--sand)"></i><u style="background:var(--sand)"></u></div><div class="hl">Glow<br><span style="font-family:var(--serif);font-style:italic;font-weight:400">ritual</span></div><div style="display:flex;gap:6px;flex-wrap:wrap"><span class="pill2" style="background:transparent;border:1px solid var(--sand);color:var(--sand)">DRY SKIN</span><span class="pill2" style="background:transparent;border:1px solid var(--sand);color:var(--sand)">DARK SPOTS</span></div><div class="grid2"><span style="background:var(--sand)"></span><span style="background:var(--taupe)"></span></div><span class="pill2">TAKE THE SKIN QUIZ</span></div>`,
    menu: `<div class="mock l"><div class="phone"><div class="hl" style="font-size:clamp(14px,1.6vw,22px)">Menu</div><div class="bar"></div><div class="bar f"></div><div class="bar f" style="width:80%"></div><div class="bar"></div><div class="bar f" style="width:60%"></div><div class="qr"></div></div></div>`,
  };
  const gallery = document.getElementById('gallery');
  let gTiles = [], gCols = 0;
  function buildLayout(count, cols) {
    const rows = []; let placed = 0, r = 0;
    while (placed < count) {
      const row = new Array(cols).fill(-1);
      const a = (r * 2 + (r % 2)) % cols;
      row[a] = placed++;
      if (r % 3 === 0 && placed < count) {
        let b = (a + 2) % cols; if (b === a) b = (a + 1) % cols;
        if (b !== a) row[b] = placed++;
      }
      rows.push(row); r++;
    }
    return rows;
  }
  function renderGallery() {
    const w = innerWidth, cols = w < 640 ? 2 : w < 1024 ? 3 : 4;
    if (cols === gCols) return; gCols = cols;
    gallery.style.setProperty('--cols', cols);
    gallery.innerHTML = buildLayout(TILES.length, cols).map(row => `<div class="g-row">${row.map((idx, ci) => {
      if (idx < 0) return `<div class="g-cell" aria-hidden="true"></div>`;
      const tile = TILES[idx], origin = ci < cols / 2 ? 'right bottom' : 'left bottom';
      const body = tile.img ? `<img src="${tile.img}" alt="" loading="lazy">` : MOCK[tile.m];
      return `<div class="g-cell"><figure class="g-tile" style="margin:0;transform-origin:${origin}">${body}<figcaption><span>${T[lang].caps[tile.cap]}</span><b>${String(idx + 1).padStart(2, '0')}</b></figcaption></figure></div>`;
    }).join('')}</div>`).join('');
    gTiles = [...gallery.querySelectorAll('.g-tile')];
    lastY = -1;
  }
  renderGallery();
  addEventListener('resize', renderGallery);

  /* ---------------- Video: two scenes, a dead zone in the centre ---------------- */
  const vidL = document.getElementById('vidL'), vidR = document.getElementById('vidR');
  const canvasEl = document.getElementById('main-canvas');
  const touch = !finePointer || matchMedia('(max-width: 1023px)').matches;
  let side = 'R', vid = vidR, targetT = 0, curT = 0, scrubbing = false, introDone = false;
  function show(which) {
    if (which === side) return;
    side = which; vid = which === 'L' ? vidL : vidR;
    vidL.style.display = which === 'L' ? 'block' : 'none';
    vidR.style.display = which === 'R' ? 'block' : 'none';
  }
  vidR.poster = SRC.pR; vidL.poster = SRC.pL; vidR.src = SRC.R;
  if (!touch) vidL.src = SRC.L;
  vidR.addEventListener('loadeddata', () => { canvasEl.style.opacity = 1; });
  if (reduce) {
    vidR.addEventListener('loadedmetadata', () => { vidR.currentTime = Math.max(0, vidR.duration - 0.05); }, { once: true });
  } else if (touch) {
    // phones: the two scenes play one after the other, forever
    const next = (from, to, w) => from.addEventListener('ended', () => { if (!to.getAttribute('src')) to.src = to === vidL ? SRC.L : SRC.R; setTimeout(() => { show(w); to.currentTime = 0; to.play().catch(() => {}); }, 1200); });
    next(vidR, vidL, 'L'); next(vidL, vidR, 'R');
    vidR.play().catch(() => {});
  } else {
    // desktop: one walk-in, then the cursor drives the scene
    vidR.play().catch(() => {});
    vidR.addEventListener('ended', () => { introDone = true; curT = targetT = vidR.duration; });
    addEventListener('mousemove', e => {
      if (!vid.duration) return;
      if (!scrubbing) {
        if (!introDone && vidR.currentTime < vidR.duration * 0.9) return;
        scrubbing = true; vidR.pause(); vidL.pause(); curT = vid.currentTime;
      }
      const w = innerWidth, c = w / 2, dead = Math.max(30, w * 0.05), x = e.clientX, range = c - dead;
      if (x > c + dead) { if (side !== 'R') { show('R'); curT = 0; } targetT = Math.min(1, (x - c - dead) / range) * (vid.duration - 0.04); }
      else if (x < c - dead) { if (side !== 'L') { show('L'); curT = 0; } targetT = Math.min(1, (c - dead - x) / range) * (vid.duration - 0.04); }
      else targetT = 0; // dead zone: the character stands still, facing you
    }, { passive: true });
  }

  /* ---------------- Cursor ---------------- */
  const cursor = document.getElementById('cursor');
  if (!touch) {
    document.body.classList.add('has-cursor');
    addEventListener('mousemove', e => { cursor.style.opacity = 1; cursor.style.left = e.clientX + 'px'; cursor.style.top = e.clientY + 'px'; }, { passive: true });
    document.addEventListener('mouseover', e => {
      cursor.classList.toggle('small', !!e.target.closest('input, textarea, button, a, label'));
    });
    document.addEventListener('mouseleave', () => cursor.style.opacity = 0);
    document.addEventListener('mouseenter', () => cursor.style.opacity = 1);
  }

  /* ---------------- Kinetic headlines ---------------- */
  function splitWords(el) {
    const walk = node => {
      [...node.childNodes].forEach(n => {
        if (n.nodeType === 3) {
          const frag = document.createDocumentFragment();
          n.textContent.split(/(\s+)/).forEach(part => {
            if (!part) return;
            if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(part)); return; }
            const w = document.createElement('span'); w.className = 'w';
            const inner = document.createElement('span'); inner.textContent = part;
            w.appendChild(inner); frag.appendChild(w);
          });
          n.replaceWith(frag);
        } else if (n.nodeType === 1 && !n.classList.contains('w')) walk(n);
      });
    };
    walk(el); el.classList.add('rv');
    return [...el.querySelectorAll('.w > span')];
  }
  let reveals = [];
  function buildReveals() { reveals = [...document.querySelectorAll('.intro h1, .gal-head h2, #outro h2, .bp-card h2, .words-hero h2')].map(el => ({ el, words: splitWords(el) })); }
  buildReveals();
  const bandRows = [...document.querySelectorAll('.band .row')];

  /* ---------------- Scroll engine (RAF) ---------------- */
  const logo = document.getElementById('logo'), caption = document.getElementById('caption'),
        nav = document.getElementById('nav'), info = document.getElementById('outro-info'),
        bar = document.getElementById('bar'), overlay = document.getElementById('outro-overlay'),
        outro = document.getElementById('outro'), footer = document.getElementById('outro-footer'),
        sym = document.getElementById('circle-symbol');
  const SYMS = ['?', '!', '/', '%', '&', '@', '#'];
  let lastSym = 0;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  function frame(now) {
    const vh = innerHeight, y = scrollY;

    // video scrub, only while hero is visible
    if (scrubbing && y < vh && !vid.seeking && vid.readyState >= 2) {
      curT += (targetT - curT) * 0.18;
      if (Math.abs(vid.currentTime - curT) > 0.03) vid.currentTime = curT;
    }

    if (y !== lastY || now - lastSym > 600) {
      const p1 = clamp(y / vh, 0, 1);
      // hero UI drifts up and fades as the panel rises
      const heroFade = 1 - clamp((p1 - 0.15) / 0.55, 0, 1);
      logo.style.opacity = caption.style.opacity = info.style.opacity = heroFade;
      logo.style.transform = `translateY(${-p1 * 60}px)`;
      caption.style.transform = `translateY(${-p1 * 90}px)`;
      info.style.transform = `translateY(${-p1 * 120}px)`;
      nav.style.opacity = heroFade; nav.style.pointerEvents = heroFade < 0.2 ? 'none' : 'auto';
      bar.classList.toggle('on', p1 > 0.85);
      canvasEl.style.visibility = y > vh * 1.05 ? 'hidden' : 'visible';

      if (y !== lastY && now - lastSym > 80 && y < vh) { sym.textContent = SYMS[(Math.random() * SYMS.length) | 0]; lastSym = now; }

      // gallery tiles: scale 0 -> 1 on enter, 1 -> 0 on exit
      for (const g of gTiles) {
        const r = g.parentNode.getBoundingClientRect();
        let sc = 0;
        if (reduce) sc = 1;
        else if (r.bottom > 0 && r.top < vh) sc = Math.max(0, Math.min(Math.min(1, (vh - r.top) / (vh * 0.6)), Math.min(1, r.bottom / (vh * 0.4))));
        g.style.transform = `scale(${sc.toFixed(4)})`;
        const img = g.querySelector('img');
        if (img && !reduce && sc > 0) { const off = ((r.top + r.height / 2) - vh / 2) * -0.12; img.style.transform = `translateY(${off.toFixed(1)}px) scale(1.18)`; }
      }

      // giant band slides sideways with the scroll
      for (const row of bandRows) {
        if (reduce) break;
        const r = row.getBoundingClientRect();
        if (r.bottom < -200 || r.top > vh + 200) continue;
        const d = +row.dataset.dir, t = (vh - r.top) / (vh + r.height);
        row.style.transform = `translateX(${(d < 0 ? -t * 38 : -38 + t * 38).toFixed(2)}%)`;
      }

      // headlines rise word by word
      for (const rv of reveals) {
        const r = rv.el.getBoundingClientRect();
        const p = reduce ? 1 : clamp((vh * 0.95 - r.top) / (vh * 0.35), 0, 1);
        if (rv.p === p) continue; rv.p = p;
        const n = rv.words.length;
        rv.words.forEach((w, i) => { const k = clamp(p * (1 + n * 0.06) - i * 0.06, 0, 1); w.style.transform = `translateY(${((1 - k) * 105).toFixed(1)}%)`; });
      }

      // cards scale in and out (skip the card being typed in)
      const active = document.activeElement && document.activeElement.closest ? document.activeElement.closest('.bp-card') : null;
      for (const c of cards) {
        const r = c.getBoundingClientRect();
        let s, o;
        if (reduce || c === active) { s = 1; o = 1; }
        else if (r.bottom <= 0 || r.top >= vh) { s = 0.7; o = 0; }
        else {
          const enter = Math.min(1, (vh - r.top) / (vh * 0.6));
          const exit = Math.min(1, r.bottom / (vh * 0.4));
          const k = Math.max(0, Math.min(enter, exit));
          s = 0.7 + 0.3 * k; o = 0.15 + 0.85 * k;
          c._rot = (1 - k) * (c.classList.contains('pos-1') ? 4 : -4);
        }
        c.style.transform = `scale(${s.toFixed(4)}) rotate(${(reduce || c === active ? 0 : (c._rot || 0)).toFixed(2)}deg)`;
        c.style.opacity = o.toFixed(3);
      }

      // outro
      const ot = outro.getBoundingClientRect().top;
      const po = clamp((vh - ot) / (vh * 0.8), 0, 1);
      overlay.style.opacity = po;
      footer.style.opacity = clamp((po - 0.5) * 2, 0, 1);
      const sb = clamp((po - 0.35) / 0.65, 0, 1);
      sendBtn.style.transform = `scale(${reduce ? (sb > 0 ? 1 : 0) : sb.toFixed(4)})`;
      sendBtn.classList.toggle('live', sb > 0.6);
      bar.style.background = po > 0.5 ? 'rgba(243,236,226,.92)' : '';
      bar.querySelector('.mark').style.color = po > 0.5 ? 'var(--wine)' : '';
      bar.querySelector('.prog').style.color = po > 0.5 ? 'var(--merlot)' : '';
      bar.querySelectorAll('.barbtn').forEach(b => b.style.color = po > 0.5 ? 'var(--wine)' : 'var(--linen)');
      fill.style.background = po > 0.5 ? 'var(--merlot)' : '';

      lastY = y;
    }
    requestAnimationFrame(frame);
  }
  document.querySelectorAll('.rise').forEach(el => el.addEventListener('animationend', () => { el.classList.remove('rise'); lastY = -1; }, { once: true }));
  if (reduce) document.querySelectorAll('.rise').forEach(el => el.classList.remove('rise'));
  requestAnimationFrame(frame);
  form.addEventListener('focusin', () => { lastY = -1; });
})();
</script>

</body>
</html>
