 {id:"ce3",title:"Document 3 · Le samedi d'Akosua",doc:`<div class="doc">Samedi dernier, Akosua s'est réveillée à six heures. Elle s'est douchée, elle s'est habillée et elle est partie au marché avec sa sœur Esi. Elles ont pris un tro-tro jusqu'à Kaneshie.<br><br>Au marché, Akosua a acheté deux kilos de riz, du poisson fumé et un peu de piment. Elle a voulu des avocats, mais il n'y avait plus d'avocats. Esi n'a rien acheté : elle a oublié son argent à la maison !<br><br>À midi, les deux sœurs sont allées dans un petit restaurant. Akosua a mangé du waakye et Esi a pris du jollof. Elles n'ont pas bu de soda, seulement de l'eau.<br><br>L'après-midi, Akosua est rentrée chez elle et elle a préparé une grande soupe pour sa famille. Le soir, elle s'est couchée très tôt, à vingt et une heures. Elle vient de m'envoyer un message : « Je suis en train de manger le reste de la soupe ! »</div>`,

/* recordings in IndexedDB */
const DB={db:null,open(){return new Promise(r=>{try{const q=indexedDB.open("hal_m4",1);q.onupgradeneeded=()=>q.result.createObjectStore("rec");q.onsuccess=()=>{this.db=q.result;r()};q.onerror=()=>r()}catch(e){r()}})},

function frVoice(){const v=speechSynthesis.getVoices();return v.find(x=>/fr[-_]FR/i.test(x.lang)&&/google|natural|neural|amelie|thomas|audrey/i.test(x.name))||v.find(x=>/^fr/i.test(x.lang))}
function speak(text,rate=.85){return new Promise(res=>{try{speechSynthesis.cancel();const parts=text.split(/\s*\.\.\.\s*/);let i=0;const next=()=>{if(i>=parts.length)return res();const u=new SpeechSynthesisUtterance(parts[i++]);u.lang="fr-FR";const v=frVoice();if(v)u.voice=v;u.rate=rate;u.onend=()=>setTimeout(next,650);u.onerror=()=>next();speechSynthesis.speak(u)};next()}catch(e){res()}})}

 go(S.sec||"intro");
}
function go(s){if(s!=="co")speechSynthesis.cancel();S.sec=s;save();document.querySelectorAll("nav.side button").forEach(b=>b.classList.toggle("on",b.dataset.s===s));
 const m=$("#main");m.innerHTML=({intro:vIntro,co:vCO,ce:vCE,lg:vLG,pe:vPE,po:vPO,end:vEnd})[s]();bind(s);window.scrollTo(0,0);progress()}
function navb(prev,next){return `<div class="navb">${prev?`<button class="btn sec" onclick="go('${prev}')">← Back</button>`:"<span></span>"}${next?`<button class="btn" onclick="go('${next}')">Next part →</button>`:""}</div>`}
function mcq(id,q,opts){return `<div class="q"><div class="qt">${q}</div><div class="opts">${opts.map((o,i)=>`<button class="opt ${S.ans[id]===i?"sel":""}" data-q="${id}" data-i="${i}">${esc(o)}</button>`).join("")}</div></div>`}

function vIntro(){return `<div class="card"><div class="kick">Month 4 · Le pont vers l'A2</div><h1>Your exam: how it works</h1>
<div class="box">You do the exam <b>in one sitting of 2 h 30</b>.</div><p>For the first time, your exam follows the format of the official <b>DELF</b>: the 4 skills, plus the language. Total: <b>100 points</b>. Time: <b>2 h 30</b>.</p>
<div class="q">🎧 <b>Listening (20)</b> · 4 recordings, max 2 listens each<br>📖 <b>Reading (20)</b> · a menu, a receipt, a WhatsApp message, a story<br>🧩 <b>Language (20)</b> · grammar and vocabulary of Months 1 to 4<br>✍️ <b>Writing (20)</b> · a WhatsApp message, a postcard, a form<br>🎙️ <b>Speaking (20)</b> · « Mon week-end », a role play at the maquis, reading aloud</div>
<div class="box"><b>Rules</b><br>• You can move freely between the parts (left menu). Your answers are saved automatically.<br>• Use headphones for the Listening part. Allow the microphone for the Speaking part.<br>• Work alone, without notes, dictionary or translator. Each time you leave this page, it is counted.<br>• At the end, go to <b>Submit</b> and wait for the confirmation. Do not close the page before.</div>
<p class="mut small">Your answers are saved in this browser. If something goes wrong, reopen the same link on the same device: you continue where you stopped.</p>${navb(null,"co")}</div>`}

function vCO(){return `<div class="card"><div class="kick">Part 1 · /20</div><h2>🎧 Listening · Compréhension orale</h2><p class="mut">Put your headphones on. Read the questions <b>before</b> you listen. Each recording can be played <b>${MAX_PLAYS} times</b> only.</p></div>`+
 CO.map(d=>{const n=S.plays[d.id]||0;return `<div class="card"><h3>${d.title}</h3><p class="mut">${d.instr}</p><div class="player"><button class="btn" data-play="${d.id}" ${n>=MAX_PLAYS?"disabled":""}>▶ Play</button><span class="left" id="pl_${d.id}">${n>=MAX_PLAYS?"No more listens":"Listens left: "+(MAX_PLAYS-n)}</span></div>
 ${d.qs.map((q,i)=>mcq(d.id+"_"+i,(i+1)+". "+q[0],q[1])).join("")}</div>`}).join("")+navb("intro","ce")}

function vCE(){return `<div class="card"><div class="kick">Part 2 · /20</div><h2>📖 Reading · Compréhension écrite</h2><p class="mut">Read each document, then answer. « Pas dans le texte » = the text does not say it.</p></div>`+
 CE.map(d=>`<div class="card"><h3>${d.title}</h3>${d.doc}${d.qs.map((q,i)=>mcq(d.id+"_"+i,(i+1)+". "+q[0],q[1])).join("")}</div>`).join("")+navb("co","lg")}

function vLG(){return `<div class="card"><div class="kick">Part 3 · /20</div><h2>🧩 Language · Grammaire et vocabulaire</h2><p class="mut">Choose the correct answer. 1 point each.</p>${LG.map((q,i)=>mcq("lg_"+i,`<b>${i+1}.</b> `+esc(q[0]).replace("___","<b>_____</b>"),q[1])).join("")}</div>`+navb("ce","pe")}

function vPE(){return `<div class="card"><div class="kick">Part 4 · /20</div><h2>✍️ Writing · Production écrite</h2><p class="mut">Write in French only. Check your accents, your agreements with ÊTRE and « pas de » before you go on.</p></div>`+
 PE.map(t=>`<div class="card"><h3>${t.title}</h3><p>${t.instr}</p><div class="box"><b>You must use:</b><br>${t.must.map(m=>"• "+m).join("<br>")}</div><textarea data-t="${t.id}" placeholder="Écrivez ici…">${esc(S.txt[t.id]||"")}</textarea><div class="count" id="wc_${t.id}">${words(S.txt[t.id])} words · minimum ${t.min}</div></div>`).join("")+
 `<div class="card"><h3>Task 3 · Le formulaire (4 points)</h3><p>You are booking a room at the Hôtel Ivoire in Abidjan. Fill in the form <b>in French</b>, with your real information.</p><div class="grid2">${FORM.map(f=>`<div><label class="f">${f[1]}</label><input type="text" data-f="${f[0]}" value="${esc(S.form[f[0]]||"")}"></div>`).join("")}</div></div>`+navb("lg","po")}

function recUI(id,max){return `<div class="rec" id="rw_${id}"><button class="btn" data-rec="${id}" data-max="${max}">● Record</button><span class="dot" id="dot_${id}"></span><span class="mut small" id="rs_${id}">${REC[id]?"Recorded ✔ · you can record again":"Not recorded yet"} · max ${Math.round(max/60*10)/10} min</span></div><div id="ra_${id}"></div>`}
function vPO(){return `<div class="card"><div class="kick">Part 5 · /20</div><h2>🎙️ Speaking · Production orale</h2><p class="mut">Allow the microphone when your browser asks. Speak clearly, close to your phone or computer. You can record again if you are not happy: only the last recording is kept.</p><div class="box">⚠ No script! Prepare <b>key words</b> only. A small mistake is OK; reading a written text is not (except in Task 3).</div></div>`+
 `<div class="card"><h3>${PO[0].title}</h3><p>${PO[0].instr}</p>${recUI("po1",PO[0].max)}</div>`+
 `<div class="card"><h3>${PO[1].title}</h3><p>${PO[1].instr}</p>${PO[1].lines.map((l,i)=>`<div class="q"><div class="qt">🧑🏾‍🍳 <b>Serveur ${i+1} :</b> « ${esc(l[1])} » <button class="btn sec" style="padding:6px 12px" data-say="${esc(l[1])}">🔊</button></div>${recUI(l[0],PO[1].max)}</div>`).join("")}</div>`+
 `<div class="card"><h3>${PO[2].title}</h3><p>${PO[2].instr}</p><div class="doc">${esc(PO[2].text)}</div>${recUI("po3",PO[2].max)}</div>`+navb("pe","end")}

function vEnd(){const c=checklist();return `<div class="card"><div class="kick">Last step</div><h2>✅ Submit your exam</h2><p>Check that everything is done. You can still go back to any part.</p>
 ${c.map(x=>`<div class="q">${x[1]?"✅":"⚠️"} ${x[0]}</div>`).join("")}
 <label class="f">A word for your coach (optional)</label><textarea data-t="comment" style="min-height:80px" placeholder="How did you find the exam?">${esc(S.txt.comment||"")}</textarea>
 <div class="navb"><button class="btn sec" onclick="go('po')">← Back</button><button class="btn" id="submit">Submit my exam</button></div><div id="sendlog" class="mut small" style="margin-top:12px"></div></div>`}

function checklist(){const all=[...CO.flatMap(d=>d.qs.map((q,i)=>d.id+"_"+i)),...CE.flatMap(d=>d.qs.map((q,i)=>d.id+"_"+i)),...LG.map((q,i)=>"lg_"+i)];
 const miss=all.filter(k=>S.ans[k]===undefined).length;
 const recs=["po1","po2a","po2b","po2c","po2d","po3"];const rmiss=recs.filter(r=>!REC[r]).length;
 return [[`Questions answered: ${all.length-miss} / ${all.length}`,miss===0],[`Writing task 1: ${words(S.txt.pe1)} words (min. 60)`,words(S.txt.pe1)>=60],[`Writing task 2: ${words(S.txt.pe2)} words (min. 40)`,words(S.txt.pe2)>=40],[`Form: ${FORM.filter(f=>(S.form[f[0]]||"").trim()).length} / ${FORM.length} fields`,FORM.every(f=>(S.form[f[0]]||"").trim())],[`Recordings: ${recs.length-rmiss} / ${recs.length}`,rmiss===0]]}

function progress(){const all=CO.reduce((a,d)=>a+d.qs.length,0)+CE.reduce((a,d)=>a+d.qs.length,0)+LG.length+2+FORM.length+6;
 let n=Object.keys(S.ans).length+(words(S.txt.pe1)>=60)+(words(S.txt.pe2)>=40)+FORM.filter(f=>(S.form[f[0]]||"").trim()).length+Object.keys(REC).length;
 const p=Math.min(100,Math.round(n/all*100));const b=$("#pbar");if(b){b.style.width=p+"%";$("#ptxt").textContent=p+"% completed"}}

/* ====================== BINDINGS ====================== */
function bind(s){
 document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{S.ans[b.dataset.q]=+b.dataset.i;save();document.querySelectorAll(`.opt[data-q="${b.dataset.q}"]`).forEach(x=>x.classList.toggle("sel",x===b));progress()});
 document.querySelectorAll("textarea[data-t]").forEach(t=>t.oninput=()=>{S.txt[t.dataset.t]=t.value;save();const w=$("#wc_"+t.dataset.t);if(w){const pe=PE.find(p=>p.id===t.dataset.t);w.textContent=words(t.value)+" words · minimum "+pe.min}progress()});
 document.querySelectorAll("input[data-f]").forEach(t=>t.oninput=()=>{S.form[t.dataset.f]=t.value;save();progress()});
 document.querySelectorAll("[data-play]").forEach(b=>b.onclick=()=>play(b.dataset.play,b));
 document.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>playLine(b));
 document.querySelectorAll("[data-rec]").forEach(b=>b.onclick=()=>record(b.dataset.rec,+b.dataset.max,b));
 document.querySelectorAll("[id^=ra_]").forEach(d=>{const id=d.id.slice(3);if(REC[id])d.innerHTML=`<audio controls src="${URL.createObjectURL(REC[id])}"></audio>`});
 if(s==="end")$("#submit").onclick=submit;
}

/* listening: real recording audio/<id>.mp3 if it exists, otherwise French synthetic voice */
let playing=false;
async function play(id,btn){if(playing)return;const n=S.plays[id]||0;if(n>=MAX_PLAYS)return;
 playing=true;document.querySelectorAll("[data-play]").forEach(b=>b.disabled=true);$("#pl_"+id).textContent="Playing…";
 S.plays[id]=n+1;save();
 const d=CO.find(x=>x.id===id);
 const ok=await new Promise(res=>{const a=new Audio("audio/"+id+".mp3");a.onended=()=>res(true);a.onerror=()=>res(false);a.play().catch(()=>res(false))});
 if(!ok)await speak(d.tts);
 playing=false;const left=MAX_PLAYS-S.plays[id];
 document.querySelectorAll("[data-play]").forEach(b=>b.disabled=(S.plays[b.dataset.play]||0)>=MAX_PLAYS);
 $("#pl_"+id).textContent=left>0?"Listens left: "+left:"No more listens"}
async function playLine(b){const t=b.dataset.say;const k=PO[1].lines.find(l=>l[1]===t)[0];
 const ok=await new Promise(res=>{const a=new Audio("audio/"+k+".mp3");a.onended=()=>res(true);a.onerror=()=>res(false);a.play().catch(()=>res(false))});if(!ok)speak(t,.9)}

/* recording */
let MR=null,chunks=[],recTimer=null,curId=null;
async function record(id,max,btn){
 if(MR&&MR.state==="recording"){MR.stop();return}
 try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const mime=MediaRecorder.isTypeSupported("audio/webm")?"audio/webm":(MediaRecorder.isTypeSupported("audio/mp4")?"audio/mp4":"");
  MR=new MediaRecorder(stream,mime?{mimeType:mime}:{});chunks=[];curId=id;
  MR.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  MR.onstop=async()=>{clearInterval(recTimer);stream.getTracks().forEach(t=>t.stop());const blob=new Blob(chunks,{type:MR.mimeType||"audio/webm"});REC[id]=blob;await DB.put(id,blob);
   $("#dot_"+id).classList.remove("on");btn.textContent="● Record again";$("#rs_"+id).textContent="Recorded ✔ · "+Math.round(blob.size/1024)+" KB";$("#ra_"+id).innerHTML=`<audio controls src="${URL.createObjectURL(blob)}"></audio>`;progress();
   document.querySelectorAll("[data-rec]").forEach(b=>b.disabled=false)};
  MR.start(1000);$("#dot_"+id).classList.add("on");btn.textContent="■ Stop";document.querySelectorAll("[data-rec]").forEach(b=>{if(b!==btn)b.disabled=true});
  let s=0;recTimer=setInterval(()=>{s++;$("#rs_"+id).textContent="Recording… "+Math.floor(s/60)+":"+String(s%60).padStart(2,"0");if(s>=max)MR.stop()},1000);
 }catch(e){alert("The microphone is blocked. Please allow the microphone for this page (click the 🔒 icon next to the address) and try again.")}}

/* timer + page exits */
function tick(){if(!S.start)return;const left=S.start+DURATION_MIN*60000-Date.now();const t=$("#timer");
 if(left<=0){t.textContent="Time is up";t.classList.add("warn");if(!S.done&&!S.timeUp){S.timeUp=true;save();alert("Time is up! Please go to Submit now.");go("end")}return}
 const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);t.textContent=(m>=60?Math.floor(m/60)+"h"+String(m%60).padStart(2,"0"):m)+":"+String(s).padStart(2,"0");t.classList.toggle("warn",left<15*60000)}
document.addEventListener("visibilitychange",()=>{if(document.hidden&&S.started&&!S.done){S.exits=(S.exits||0)+1;save()}});

/* ====================== SCORING + REPORT ====================== */
function scores(){let co=0,ce=0,lg=0;
 CO.forEach(d=>d.qs.forEach((q,i)=>{if(S.ans[d.id+"_"+i]===q[2])co++}));
 CE.forEach(d=>d.qs.forEach((q,i)=>{if(S.ans[d.id+"_"+i]===q[2])ce+=d.id==="ce3"?1:1}));
 LG.forEach((q,i)=>{if(S.ans["lg_"+i]===q[2])lg++});return {co,ce,lg,total:co+ce+lg}}
function report(links){const sc=scores();const L=[];
 L.push("HA LINGUA — EXAMEN DU MOIS 4 · LE PONT VERS L'A2");L.push("Élève : "+S.name);L.push("Session : "+S.session);
 L.push("Début : "+new Date(S.start).toLocaleString("fr-FR"));L.push("Durée utilisée : "+Math.round((Date.now()-S.start)/60000)+" min / "+DURATION_MIN+" min");L.push("Sorties de la page : "+(S.exits||0));L.push("");
 L.push("SCORES AUTOMATIQUES");L.push("CO Compréhension orale : "+sc.co+" / 20");L.push("CE Compréhension écrite : "+sc.ce+" / 20");L.push("Langue : "+sc.lg+" / 20");L.push("TOTAL AUTO : "+sc.total+" / 60");
 L.push("PE Production écrite : ___ / 20 (message ___/10 · carte postale ___/6 · formulaire ___/4)");L.push("PO Production orale : ___ / 20 (mon week-end ___/8 · jeu de rôle ___/7 · lecture ___/5)");L.push("");
 const sect=(t,arr,pref)=>{L.push("=== "+t+" ===");arr.forEach(d=>{L.push("— "+d.title);d.qs.forEach((q,i)=>{const a=S.ans[(pref||d.id)+"_"+i];L.push(`${a===q[2]?"✔":"✘"} ${q[0]} → « ${a===undefined?"(pas de réponse)":q[1][a]} »${a===q[2]?"":" | attendu : « "+q[1][q[2]]+" »"}`)})});L.push("")};
 sect("CO · ÉCOUTE (écoutes : "+CO.map(d=>(S.plays[d.id]||0)).join("/")+")",CO);sect("CE · LECTURE",CE);
 L.push("=== LANGUE ===");LG.forEach((q,i)=>{const a=S.ans["lg_"+i];L.push(`${a===q[2]?"✔":"✘"} ${i+1}. ${q[0]} → « ${a===undefined?"(pas de réponse)":q[1][a]} »${a===q[2]?"":" | attendu : « "+q[1][q[2]]+" »"}`)});L.push("");
 L.push("=== PE1 · MESSAGE « MON WEEK-END » (/10) — "+words(S.txt.pe1)+" mots ===");L.push(S.txt.pe1||"(vide)");L.push("");
 L.push("=== PE2 · CARTE POSTALE (/6) — "+words(S.txt.pe2)+" mots ===");L.push(S.txt.pe2||"(vide)");L.push("");
 L.push("=== PE3 · FORMULAIRE (/4) ===");FORM.forEach(f=>L.push(f[1]+" : "+(S.form[f[0]]||"—")));L.push("");
 L.push("=== PO · ENREGISTREMENTS ===");["po1","po2a","po2b","po2c","po2d","po3"].forEach(k=>L.push(k+" : "+(links&&links[k]?links[k]:(REC[k]?"(envoi en cours ou échoué : voir l'envoi suivant)":"non enregistré"))));L.push("");
 if(S.txt.comment)L.push("Commentaire de l'élève : "+S.txt.comment);return L.join("\n")}
async function fs(payload){const r=await fetch(FORMSPREE,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(payload)});if(!r.ok)throw new Error("Formspree "+r.status);return true}
function b64(blob){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(String(f.result).split(",")[1]);f.readAsDataURL(blob)})}
async function upload(key,blob){const ext=(blob.type.includes("mp4")?"m4a":"webm");const name=`M4_${S.name.replace(/[^\w]+/g,"_")}_${key}.${ext}`;const data=await b64(blob);
 const body={name,filename:name,fileName:name,mimeType:blob.type,type:blob.type,data,file:data,base64:data,student:S.name,exam:"Mois 4"};
 const tryOnce=async(opts)=>{const ac=new AbortController();const t=setTimeout(()=>ac.abort(),45000);try{const r=await fetch(UPLOAD_URL,{method:"POST",...opts,signal:ac.signal});const txt=await r.text();clearTimeout(t);const m=txt.match(/https:\/\/(drive|docs)\.google\.com\/[^"'\s\\]+/);return m?m[0]:null}catch(e){clearTimeout(t);return null}};
 return (await tryOnce({headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)}))||(await tryOnce({headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams(body).toString()}))}
async function submit(){const btn=$("#submit");const log=$("#sendlog");btn.disabled=true;const out=m=>log.innerHTML+=m+"<br>";
 S.done=true;save();const sc=scores();
 try{out("1/3 · Sending your answers…");await fs({eleve:S.name,session:S.session,CO:sc.co+"/20",CE:sc.ce+"/20",Langue:sc.lg+"/20",total_auto:sc.total+"/60",sorties_de_page:S.exits||0,_subject:"Examen Mois 4 — "+S.name+" — "+sc.total+"/60",rapport:report(null)});out("✅ Answers received.")}
 catch(e){out("⚠️ Sending failed. Check your internet connection and click Submit again.");btn.disabled=false;return}
 out("2/3 · Sending your recordings (this can take a few minutes, do not close the page)…");const links={};
 for(const k of ["po1","po2a","po2b","po2c","po2d","po3"]){if(!REC[k])continue;const u=await upload(k,REC[k]);links[k]=u||"ÉCHEC";out((u?"✅ ":"⚠️ ")+k)}
 out("3/3 · Final confirmation…");
 try{await fs({eleve:S.name,session:S.session,_subject:"Examen Mois 4 — "+S.name+" — enregistrements",speaking:JSON.stringify(links)});}catch(e){}
 S.sent=true;save();
 const failed=Object.values(links).some(v=>v==="ÉCHEC");
 $("#main").innerHTML=`<div class="card"><div class="kick">Done</div><h1>Merci, ${esc(S.name.split(" ")[0])} ! 🎉</h1><p>Your exam has been sent to Hannielle. Your results will come with your Month 4 report.</p>${failed?`<div class="box">⚠️ Some recordings could not be sent automatically. Please download them below and send them to <b>hannielleatche@gmail.com</b>.</div>`:""}<div id="dl"></div><p class="mut small">Bonne fin de semaine, et à samedi pour le Mois 5 !</p></div>`;
 $("#dl").innerHTML=Object.keys(REC).map(k=>`<a class="btn sec" style="margin:4px" download="M4_${esc(S.name)}_${k}.${REC[k].type.includes("mp4")?"m4a":"webm"}" href="${URL.createObjectURL(REC[k])}">⬇ ${k}</a>`).join("")}

/* ====================== START ====================== */
function startScreen(){
 $("#root").innerHTML=`<div class="intro"><div class="card"><div class="kick">HA LINGUA · French Premium Live Group</div><h1>Le pont vers l'A2</h1>
 <div class="bridge"><div class="arc"></div><div class="deck"></div><span class="lbl" style="left:3%">A1</span><span class="lbl" style="right:3%">A2</span><span class="walker">🚶🏾‍♀️</span></div>
 <div class="story"><p style="animation-delay:.2s">Four weeks ago, you could only talk about <b>today</b>.</p><p style="animation-delay:1.4s">Then you learned to ask any question, to tell what you <b>did</b>, where you <b>went</b>, what you <b>ate</b> and what you <b>bought</b>.</p><p style="animation-delay:2.6s">Today, you cross the bridge. Show what you can do.</p></div>
 <label class="f">Your full name</label><input type="text" id="nm" placeholder="e.g. Akua Serwaa Mensah">
 <label class="f">Your group</label><select id="ss"><option value="">Choose…</option><option>Saturday morning (9AM)</option><option>Saturday evening (7PM)</option><option>Other</option></select>
 <p class="mut small">The exam lasts 2 h 30. The timer starts when you click « Start ». Make sure you have headphones, a microphone and a quiet place.</p>
 <button class="btn" id="go">Start the exam →</button></div></div>`;
 $("#go").onclick=()=>{const n=$("#nm").value.trim(),s=$("#ss").value;if(n.split(/\s+/).length<2||!s){alert("Please write your full name and choose your group.");return}
  S={...S,started:true,name:n,session:s,start:Date.now(),sec:"intro"};save();shell()}}

(async()=>{await DB.open();
 if(qs.has("new"))await DB.clear();
 for(const k of ["po1","po2a","po2b","po2c","po2d","po3"]){const b=await DB.get(k);if(b)REC[k]=b}
 if(S.started&&S.done&&qs.has("recover")){shell();go("end");return}
 if(S.started&&S.done){$("#root").innerHTML=`<div class="intro"><div class="card"><h1>Exam already submitted ✔</h1><p>Thank you, ${esc(S.name)}. Your exam was sent.</p><p class="mut small">If Hannielle asks you to send it again, open this link with <b>?recover</b> at the end.</p></div></div>`;return}
 if(S.started)shell();else startScreen()})();
if("speechSynthesis" in window)speechSynthesis.onvoiceschanged=()=>{};
</script>
